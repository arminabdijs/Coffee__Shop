name: GitPortfolio Pages

on:
  push:
    branches: ['main']

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Setup Pages
        id: pages
        uses: actions/configure-pages@v5
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install dependencies
        shell: bash
        working-directory: .
        run: |
          set -euo pipefail
          corepack enable
          if [ 'npm' = 'pnpm' ]; then pnpm install --frozen-lockfile || pnpm install;
          elif [ 'npm' = 'yarn' ]; then yarn install --immutable || yarn install --frozen-lockfile;
          elif [ 'npm' = 'bun' ]; then bun install --frozen-lockfile || bun install;
          elif [ -f package-lock.json ]; then npm ci; else npm install; fi
      - name: Build site
        shell: bash
        working-directory: .
        run: |
          set -euo pipefail
          if [ -f package.json ] && node -e "const p=require('./package.json'); process.exit(p.scripts && p.scripts.build ? 0 : 1)"; then npm run build; fi
      - name: Resolve publish directory
        id: output
        shell: bash
        env:
          OUTPUT_DIR: 'public'
          BUILD_DIR: '.'
        run: |
          set -euo pipefail
          if [ "$OUTPUT_DIR" != '__AUTO__' ] && [ -f "$OUTPUT_DIR/index.html" ]; then echo "dir=$OUTPUT_DIR" >> "$GITHUB_OUTPUT"; exit 0; fi
          for d in dist build out public site _site .output/public docs public_html; do
            if [ -f "$BUILD_DIR/$d/index.html" ]; then echo "dir=$BUILD_DIR/$d" >> "$GITHUB_OUTPUT"; exit 0; fi
          done
          if [ -f "$BUILD_DIR/index.html" ]; then echo "dir=$BUILD_DIR" >> "$GITHUB_OUTPUT"; exit 0; fi
          candidate=$(find "$BUILD_DIR" -type f -name index.html -not -path '*/node_modules/*' -not -path '*/.git/*' -not -path '*/.next/*' -not -path '*/.nuxt/*' -not -path '*/.svelte-kit/*' -not -path '*/vendor/*' -not -path '*/tests/*' -not -path '*/test/*' | head -n 1 || true)
          if [ -n "$candidate" ]; then echo "dir=$(dirname "$candidate")" >> "$GITHUB_OUTPUT"; exit 0; fi
          echo 'No deployable index.html was produced. Configure an output directory or a static export for this framework.' >&2; exit 1
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: ${{ steps.output.outputs.dir }}
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4